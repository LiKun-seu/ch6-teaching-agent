location = /teachdemo {
    include /etc/nginx/snippets/teachdemo-proxy.conf;
}

location = /teachdemo/api/chat {
    limit_req zone=teachdemo_api burst=5 nodelay;
    limit_conn teachdemo_connections 3;
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/snippets/teachdemo-proxy.conf;
}

location = /teachdemo/api/digest {
    limit_req zone=teachdemo_api burst=5 nodelay;
    limit_conn teachdemo_connections 3;
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/snippets/teachdemo-proxy.conf;
}

location ^~ /teachdemo/ {
    include /etc/nginx/snippets/teachdemo-proxy.conf;
}
